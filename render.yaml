services:
  - type: web
    name: bulldog-reach
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.20-0309-non-reasoning
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_DOMAIN
        value: yale.edu
      - key: DAILY_PLAN_LIMIT
        value: "10"
      - key: DAILY_DECK_LIMIT
        value: "15"
      - key: MONTHLY_CALL_CAP
        value: "3000"
