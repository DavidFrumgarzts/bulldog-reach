services:
  - type: web
    name: bulldog-reach
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_DOMAIN
        value: yale.edu
      - key: DAILY_PLAN_LIMIT
        value: "10"
      - key: DAILY_DECK_LIMIT
        value: "15"
      - key: MONTHLY_CALL_CAP
        value: "3000"
