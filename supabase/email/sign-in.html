<!-- Bulldog Reach sign-in email. Paste into Supabase → Authentication → Emails → "Magic Link" AND "Confirm signup".
     Subject: Your Bulldog Reach code: {{ .Token }} -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Your Bulldog Reach sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#0E0806;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0E0806;">
  <tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
      <!-- logo -->
      <tr><td style="padding:0 4px 24px 4px;font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;letter-spacing:-1px;color:#ffffff;">B_ <span style="font-size:15px;font-weight:600;letter-spacing:0;color:#B9A08A;">&nbsp;Bulldog Reach</span></td></tr>
      <!-- card -->
      <tr><td style="background:#2A170B;background-image:linear-gradient(160deg,#7A4A22 0%,#2A170B 55%,#1B120C 100%);border-radius:28px;padding:40px 36px;font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
        <h1 style="margin:0 0 8px 0;font-size:40px;line-height:1.02;font-weight:700;letter-spacing:-1.5px;color:#ffffff;">Your sign-in code</h1>
        <p style="margin:0 0 28px 0;font-size:16px;line-height:1.5;color:#E9DCCF;">Type it into Bulldog Reach, or tap the button.</p>
        <!-- code -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td align="center" style="background:#120A05;border:1px solid #5A3A22;border-radius:20px;padding:22px 10px;">
            <div style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:40px;font-weight:700;letter-spacing:12px;color:#ffffff;">{{ .Token }}</div>
            <div style="margin-top:6px;font-size:12px;color:#B9A08A;">expires in 1 hour</div>
          </td></tr>
        </table>
        <!-- button -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px 0;">
          <tr><td align="center" bgcolor="#ffffff" style="border-radius:18px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" target="_blank" style="display:inline-block;padding:18px 30px;font-size:18px;font-weight:600;color:#111111;text-decoration:none;border-radius:18px;">Sign in to Bulldog Reach</a>
          </td></tr>
        </table>
      </td></tr>
      <!-- footer -->
      <tr><td style="padding:22px 6px 0 6px;font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7D6A5B;">
        Didn’t ask for this? Ignore it — nobody can sign in without this code.<br>
        Sent to {{ .Email }}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
